name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Быстрые пуши не должны копиться в очередь: последний коммит — и есть прод.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Настроить Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Собирать нечего: копируем пять файлов сайта в отдельную папку,
      # чтобы в артефакт не попали README, .github и прочее.
      - name: Подготовить статику
        run: |
          mkdir -p _site
          cp index.html styles.css app.js content.js .nojekyll _site/
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - id: deployment
        uses: actions/deploy-pages@v4

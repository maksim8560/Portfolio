name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Быстрые пуши не должны копиться в очередь: последний коммит — и есть прод.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Поставить зависимости
        run: npm ci

      # Проверка типов отдельно от сборки: в логе видно, что именно упало.
      - name: Проверка типов
        run: npm run typecheck

      - name: Сборка
        run: npm run build

      - name: Настроить Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - id: deployment
        uses: actions/deploy-pages@v4
